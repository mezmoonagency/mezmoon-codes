  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();s.buffer=NB;s.loop=true;f.type='lowpass';f.frequency.value=420;g.gain.value=.045;l.frequency.value=.13;lg.gain.value=.03;l.connect(lg);lg.connect(g.gain);s.connect(f);f.connect(g);g.connect(MG);s.start();l.start();

function nz(t,dur,type,f0,f1,g,q=1,dst){const a=AC;if(!a)return;try{const s=a.createBufferSource(),f=a.createBiquadFilter(),v=a.createGain();s.buffer=NB;s.loop=true;f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(v);v.connect(dst||MG);s.start(t,Math.random());s.stop(t+dur+.02)}catch(e){}}
function tn(t,dur,type,f0,f1,g,dst){const a=AC;if(!a)return;try{const o=a.createOscillator(),v=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(v);v.connect(dst||MG);o.start(t);o.stop(t+dur+.02)}catch(e){}}
